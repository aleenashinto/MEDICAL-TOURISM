services:
  # ─── PostgreSQL 16 ───────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: maides_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: maides
      POSTGRES_USER: maides
      POSTGRES_PASSWORD: maides_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maides -d maides"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis 7 ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: maides_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── MinIO (S3-compatible object storage for medical documents) ───────────────
  minio:
    image: minio/minio:latest
    container_name: maides_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: maides_minio
      MINIO_ROOT_PASSWORD: maides_minio_secret
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO Console UI
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── Adminer (PostgreSQL GUI at http://localhost:8080) ───────────────────────
  adminer:
    image: adminer:latest
    container_name: maides_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres

  # ─── MAIDES Fastify API ───────────────────────────────────────────────────────
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: maides_api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://maides:maides_dev_password@postgres:5432/maides
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_change_in_production_32chars}
      JWT_EXPIRY: 7d
      COOKIE_SECRET: ${COOKIE_SECRET:-super_secret_cookie_key_change_in_production}
      ALLOWED_ORIGINS: http://localhost:3000
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: maides-documents
      S3_ACCESS_KEY: maides_minio
      S3_SECRET_KEY: maides_minio_secret
      PORT: 4000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles:
      - production

volumes:
  postgres_data:
  redis_data:
  minio_data:
